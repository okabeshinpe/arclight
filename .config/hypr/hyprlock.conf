general {
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    
    path = /home/okabeshinpe/Wallpapers/japanese-house.png
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 300, 50

    outline_thickness = 0
    inner_color = rgba(00000000)
    font_color = rgba(ffffffff)

    dots_size = 0.30
    dots_spacing = 0.6
    dots_center = true

    fade_on_empty = true
    placeholder_text = <i>Enter password</i>

    position = -30, 90
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 80
    font_family = Orbitron
    position = 25, -25
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(ffffffff)
    font_size = 18
    font_family = Orbitron
    position = 39, -120
    halign = left
    valign = top
}

label {
    monitor =
    text = ────────────
    color = rgba(ffffffff)
    font_size = 18
    font_family = Orbitron
    position = -30, 90
    halign = right
    valign = bottom
}
