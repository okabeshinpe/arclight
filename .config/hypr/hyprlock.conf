general {
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    
    path = ~/Pictures/Wallpapers/frierenTwo.png
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ffffffff)
    inner_color = rgba(ffffff20)
    font_color = rgba(ffffffff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = -30, 90
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 80
    font_family = Orbitron
    position = 25, -25
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(ffffffff)
    font_size = 18
    font_family = Orbitron
    position = 39, 270
    halign = left
    valign = center
}
